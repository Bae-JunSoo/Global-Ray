<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>검색 결과 - GlobalRay</title>
    <link rel="stylesheet" th:href="@{/css/Base.css}">
    <link rel="stylesheet" th:href="@{/css/Header.css}">
    <link rel="stylesheet" th:href="@{/css/News.css}">
    <link rel="stylesheet" th:href="@{/css/Components.css}">
    <link rel="stylesheet" th:href="@{/css/Responsive.css}">
</head>
<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container">

    <div class="search-result-header">
        <span th:text="${keyword}">검색어</span> 검색 결과
        <span class="search-count" th:text="'(' + ${#lists.size(newsList)} + '건)'"></span>
    </div>

    <div class="news-list" th:if="${not #lists.isEmpty(newsList)}">
        <div class="news-list-item" th:each="news : ${newsList}">

            <div class="list-body">
                <a th:href="@{/news/detail/{id}(id=${news.articleId})}">
                    <h3 th:text="${news.titleKor != null and !#strings.isEmpty(news.titleKor)}
                                 ? ${news.titleKor} : ${news.title}">제목</h3>
                </a>
                <p th:text="${news.summaryShort != null and !#strings.isEmpty(news.summaryShort)}
                             ? ${news.summaryShort}
                             : (${news.description != null and !#strings.isEmpty(news.description)}
                                ? ${news.description}
                                : 'AI 요약을 준비 중입니다.')">설명</p>
                <div class="list-meta">
                    <span th:text="${news.sourceName}">언론사</span>
                    <span> · </span>
                    <span class="cat-badge" th:text="${news.catType}">카테고리</span>
                    <span> · </span>
                    <span th:text="${#temporals.format(news.regDt, 'yyyy.MM.dd')}">날짜</span>
                </div>
            </div>

            <div class="list-right">
                <img th:src="${news.thumbUrl} ?: '/images/no-image.png'"
                     class="list-thumb"
                     onerror="this.style.display='none'">
                <!-- data-action="bookmark" 으로 onclick 인라인 제거 -->
                <button sec:authorize="isAuthenticated()"
                        class="bookmark-btn"
                        th:classappend="${news.bookmarked} ? ' active' : ''"
                        th:data-url="${news.url}"
                        data-action="bookmark">
                    <span th:text="${news.bookmarked} ? '★' : '☆'">☆</span>
                </button>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(newsList)}" class="empty-msg">
        <p>"<strong th:text="${keyword}"></strong>"에 대한 검색 결과가 없습니다.</p>
        <a th:href="@{/main}" class="btn-primary">메인으로</a>
    </div>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
