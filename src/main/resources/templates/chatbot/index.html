<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>AI 챗봇 - GlobalRay</title>
    <link rel="stylesheet" th:href="@{/css/Base.css}">
    <link rel="stylesheet" th:href="@{/css/Header.css}">
    <link rel="stylesheet" th:href="@{/css/Components.css}">
    <link rel="stylesheet" th:href="@{/css/Responsive.css}">
    <link rel="stylesheet" th:href="@{/css/chatbot.css}">
</head>
<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container">
    <h2 class="section-title">AI 뉴스 챗봇</h2>
    <p class="subtitle">GlobalRay에 수집된 뉴스를 근거로 답변합니다. 인물, 국가, 기업 이름처럼 구체적인 단어로 질문해보세요.</p>

    <div class="chat-toolbar">
        <button id="clearHistoryBtn" type="button">대화 기록 삭제</button>
    </div>

    <div class="chat-wrap">
        <div class="chat-messages" id="chatMessages">
            <div class="msg bot welcome">
                <div class="bubble">
                    안녕하세요! 저는 GlobalRay AI 챗봇입니다.
                    수집된 뉴스를 찾아 근거 기사와 함께 답변해드려요.
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <textarea id="questionInput"
                      placeholder="질문을 입력하세요... (Enter: 전송, Shift+Enter: 줄바꿈)"
                      rows="2"></textarea>
            <!-- onclick 제거: chatbot.js 에서 sendBtn.addEventListener('click', sendQuestion) 으로 처리 -->
            <button id="sendBtn">전송 ↑</button>
        </div>

        <div class="chat-examples">
            <span>예시 질문:</span>
            <!-- data-action + data-question 으로 onclick 인라인 제거 -->
            <button data-action="fill-question" data-question="AI 기술 관련 뉴스 알려줘">AI 기술 뉴스</button>
            <button data-action="fill-question" data-question="미국 금리 관련 소식 정리해줘">미국 금리 소식</button>
            <button data-action="fill-question" data-question="애플 관련 뉴스 요약해줘">애플 뉴스 요약</button>
        </div>
    </div>
</main>

<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/chatbot.js}"></script>
</body>
</html>
