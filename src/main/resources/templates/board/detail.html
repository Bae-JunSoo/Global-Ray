<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title th:text="${post.title} + ' - GlobalRay'">게시글 - GlobalRay</title>
    <link rel="stylesheet" th:href="@{/css/Base.css}">
    <link rel="stylesheet" th:href="@{/css/Header.css}">
    <link rel="stylesheet" th:href="@{/css/Components.css}">
    <link rel="stylesheet" th:href="@{/css/Responsive.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>

<div th:replace="~{layout :: navbar}"></div>

<main>
    <div class="board-detail-wrap">

        <!-- 게시글 -->
        <div class="post-card">
            <div class="post-header">
                <div class="post-header-title" th:text="${post.title}">제목</div>
                <div class="post-meta">
                    <span>익명</span>
                    <span th:text="${#temporals.format(post.regDt, 'yyyy.MM.dd HH:mm')}">날짜</span>
                    <span th:if="${post.modDt != null}"
                          th:title="${#temporals.format(post.modDt, 'yyyy.MM.dd HH:mm')}">(수정됨)</span>
                    <span>조회 <span th:text="${post.viewCount}">0</span></span>
                    <span>댓글 <span th:text="${post.commentCount}">0</span></span>
                </div>
            </div>

            <div class="post-body" th:text="${post.content}">내용</div>

            <div class="post-actions">
                <a th:href="@{/board}" class="btn-back">← 목록</a>
                <div th:if="${post.mine}" class="post-owner-actions">
                    <a th:href="@{/board/{id}/edit(id=${post.id})}" class="btn-edit">수정</a>
                    <form th:action="@{/board/{id}/delete(id=${post.id})}" method="post"
                          onsubmit="return confirm('게시글을 삭제하시겠습니까?')">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn-delete">삭제</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 댓글 -->
        <div class="comment-section">
            <div class="comment-header">
                댓글 <span th:text="${post.commentCount}">0</span>
            </div>

            <div class="comment-list">
                <div th:if="${post.comments.empty}" class="comment-empty">
                    첫 번째 댓글을 남겨보세요.
                </div>
                <div th:each="comment : ${post.comments}" class="comment-item">
                    <div style="flex:1;">
                        <div class="comment-view">
                            <div class="comment-content" th:text="${comment.content}">댓글 내용</div>
                            <div class="comment-time">
                                익명 · <span th:text="${#temporals.format(comment.regDt, 'yyyy.MM.dd HH:mm')}">날짜</span>
                                <span th:if="${comment.modDt != null}">(수정됨)</span>
                            </div>
                        </div>

                        <form th:if="${comment.mine}" class="comment-edit-form" method="post"
                              th:action="@{/board/comment/{cid}/edit(cid=${comment.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="boardId" th:value="${post.id}">
                            <textarea name="content" maxlength="1000" required th:text="${comment.content}"></textarea>
                            <div class="comment-form-footer">
                                <button type="button" class="btn-cancel" data-action="toggle-comment-edit">취소</button>
                                <button type="submit" class="btn-submit">저장</button>
                            </div>
                        </form>
                    </div>

                    <div th:if="${comment.mine}" class="comment-owner-actions">
                        <button type="button" class="btn-comment-edit" data-action="toggle-comment-edit">수정</button>
                        <form th:action="@{/board/comment/{cid}/delete(cid=${comment.id})}" method="post"
                              onsubmit="return confirm('댓글을 삭제하시겠습니까?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="boardId" th:value="${post.id}">
                            <button type="submit" class="btn-comment-delete">삭제</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 댓글 작성 (로그인 시) -->
            <div sec:authorize="isAuthenticated()">
                <form th:action="@{/board/{id}/comment(id=${post.id})}" method="post" class="comment-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <textarea name="content" placeholder="댓글을 익명으로 남깁니다..." required></textarea>
                    <div class="comment-form-footer">
                        <button type="submit" class="btn-submit">댓글 등록</button>
                    </div>
                </form>
            </div>

            <!-- 비로그인 안내 -->
            <div sec:authorize="isAnonymous()" class="comment-login-notice">
                <a th:href="@{/auth/login}">로그인</a> 후 댓글을 작성할 수 있습니다.
            </div>
        </div>

    </div>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
