<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>아이디 찾기 - GlobalRay</title>
    <link rel="stylesheet" th:href="@{/css/Base.css}">
    <link rel="stylesheet" th:href="@{/css/Components.css}">
    <link rel="stylesheet" th:href="@{/css/Auth.css}">
    <link rel="stylesheet" th:href="@{/css/Responsive.css}">
</head>
<body class="auth-page">

<div class="auth-container">
    <a th:href="@{/main}" class="auth-logo">Global Ray</a>
    <p class="auth-tagline">Democracy Dies in Darkness</p>
    <h2>아이디 찾기</h2>

    <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>

    <div th:if="${foundId}" class="alert alert-success">
        회원님의 아이디는 <strong th:text="${foundId}"></strong> 입니다.
    </div>

    <form th:action="@{/auth/find-id}" method="post" class="auth-form">
        <div class="form-group">
            <label for="userName">이름</label>
            <input type="text" id="userName" name="userName"
                   placeholder="가입 시 이름" required>
        </div>
        <div class="form-group">
            <label for="userEmail">이메일</label>
            <input type="email" id="userEmail" name="userEmail"
                   placeholder="가입 시 이메일" required>
        </div>
        <button type="submit" class="btn-primary btn-full">아이디 찾기</button>
    </form>

    <div class="auth-links">
        <a th:href="@{/auth/login}">← 로그인으로 돌아가기</a>
    </div>
</div>

</body>
</html>
