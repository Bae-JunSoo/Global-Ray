<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>비밀번호 찾기 - GlobalRay</title>
    <link rel="stylesheet" th:href="@{/css/Base.css}">
    <link rel="stylesheet" th:href="@{/css/Components.css}">
    <link rel="stylesheet" th:href="@{/css/Auth.css}">
    <link rel="stylesheet" th:href="@{/css/Responsive.css}">
</head>
<body class="auth-page">

<div class="auth-container">
    <a th:href="@{/main}" class="auth-logo">Global Ray</a>
    <p class="auth-tagline">Democracy Dies in Darkness</p>
    <h2>비밀번호 찾기</h2>

    <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>

    <form th:action="@{/auth/find-pw}" method="post" class="auth-form">
        <div class="form-group">
            <label for="userId">아이디</label>
            <input type="text" id="userId" name="userId"
                   placeholder="아이디 입력" required>
        </div>
        <div class="form-group">
            <label for="userEmail">가입 이메일</label>
            <input type="email" id="userEmail" name="userEmail"
                   placeholder="가입 시 이메일" required>
        </div>
        <button type="submit" class="btn-primary btn-full">임시 비밀번호 발송</button>
    </form>

    <div class="auth-links">
        <a th:href="@{/auth/login}">← 로그인으로 돌아가기</a>
    </div>
</div>

</body>
</html>
