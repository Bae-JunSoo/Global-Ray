<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title th:text="${pageTitle} ?: 'GlobalRay'">GlobalRay</title>
    <link rel="stylesheet" th:href="@{/css/Base.css}">
    <link rel="stylesheet" th:href="@{/css/Header.css}">
    <link rel="stylesheet" th:href="@{/css/Components.css}">
    <link rel="stylesheet" th:href="@{/css/Responsive.css}">
</head>
<body>

<!-- 공통 네비게이션 바 -->
<!-- 인라인 <script> 제거: toggleUserMenu()는 main.js 에 정의되어 있으므로 중복 불필요 -->
<nav th:fragment="navbar" class="navbar">
    <div class="navbar-inner">
        <a th:href="@{/main}" class="logo">GlobalRay</a>

        <ul class="nav-cats">
            <li th:each="cat : ${categories}">
                <a th:href="@{/news/{c}(c=${cat})}"
                   th:text="${cat}"
                   th:classappend="${currentCat == cat} ? 'active' : ''">카테고리</a>
            </li>
        </ul>

        <select id="countrySelectNav" onchange="applyCountryFilter(this.value)"
                style="padding:5px 28px 5px 10px; border:1.5px solid #d1d5db;
                       border-radius:6px; font-size:13px; font-weight:500; cursor:pointer;
                       background:#fff; appearance:none; color:#374151; min-width:100px;">
            <option value="ALL">🌐 전체</option>
            <option value="US">🇺🇸 미국</option>
            <option value="EU">🇪🇺 유럽</option>
            <option value="JP">🇯🇵 일본</option>
        </select>

        <form th:action="@{/main/search}" method="get" class="search-form">
            <input type="text" name="keyword" placeholder="뉴스 검색..." required>
            <button type="submit">검색</button>
        </form>

        <div class="nav-auth">
            <span sec:authorize="isAuthenticated()">
                <div class="user-menu-wrap">
                    <!-- data-action으로 toggleUserMenu 호출 (onclick 인라인 제거) -->
                    <button class="user-menu-btn" data-action="toggle-user-menu">
                        <span th:text="${userName}"></span> 님
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <a th:href="@{/mypage}">마이페이지</a>
                        <a th:href="@{/chatbot}">Chat Bot</a>
                        <form th:action="@{/auth/logout}" method="post">
                            <button type="submit" class="dropdown-logout">로그아웃</button>
                        </form>
                    </div>
                </div>
            </span>
            <span sec:authorize="isAnonymous()">
                <a th:href="@{/auth/login}">로그인</a>
                <a th:href="@{/auth/signup}">회원가입</a>
            </span>
        </div>
    </div>
</nav>

<!-- 메인 페이지 전용 헤더 fragment -->
<!-- main/index.html 에서 th:replace="~{layout :: main-header}" 로 사용 -->
<header th:fragment="main-header" class="header">
    <div class="header-top">
        <div class="header-search">
            <form th:action="@{/main/search}" method="get">
                <input type="text" name="keyword" placeholder="검색...">
                <button type="submit">검색</button>
            </form>
        </div>

        <div class="header-auth">
            <span sec:authorize="isAnonymous()">
                <a th:href="@{/auth/login}">로그인</a>
                <a th:href="@{/auth/signup}">회원가입</a>
            </span>
            <span sec:authorize="isAuthenticated()">
                <div class="user-menu-wrap">
                    <button class="user-menu-btn" data-action="toggle-user-menu">
                        <span th:text="${userName}"></span> 님
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <a th:href="@{/mypage}">마이페이지</a>
                        <a th:href="@{/chatbot}">Chat Bot</a>
                        <form th:action="@{/auth/logout}" method="post">
                            <button type="submit" class="dropdown-logout">로그아웃</button>
                        </form>
                    </div>
                </div>
            </span>
        </div>
    </div>

    <div class="header-logo">
        <a th:href="@{/main}">
            <h1>Global Ray</h1>
            <p class="logo-sub">Democracy Dies in Darkness</p>
        </a>
    </div>

    <nav class="header-nav">
        <a th:href="@{/main}"
           th:classappend="${currentCat == null or #strings.isEmpty(currentCat)} ? ' active' : ''">전체</a>
        <a th:each="cat : ${categories}"
           th:href="@{/main(cat=${cat})}"
           th:text="${cat}"
           th:classappend="${currentCat == cat} ? ' active' : ''">카테고리</a>
        <a th:href="@{/news/top10}" style="color:#e74c3c; font-weight:700;">🔥 TOP 10</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" style="color:#7c3aed; font-weight:700;">관리자</a>

        <select id="countrySelect" onchange="applyCountryFilter(this.value)"
                style="position:absolute; left:40px; top:50%; transform:translateY(-50%);
                       padding:4px 28px 4px 10px; border:1.5px solid #d1d5db;
                       border-radius:6px; font-size:13px; font-weight:500; cursor:pointer;
                       background:#fff; appearance:none; color:#374151; min-width:100px;">
            <option value="ALL">🌐 전체</option>
            <option value="US">🇺🇸 미국</option>
            <option value="EU">🇪🇺 유럽</option>
            <option value="JP">🇯🇵 일본</option>
        </select>
    </nav>
    <script>
    function applyCountryFilter(filter) {
        const cards = document.querySelectorAll('.news-main-card, .news-list-item');
        let count = 0;
        cards.forEach(item => {
            const match = filter === 'ALL' || item.dataset.country === filter;
            item.classList.toggle('hidden', !match);
            if (match) count++;
        });
        const msg = document.getElementById('noResultMsg');
        if (msg) msg.style.display = count === 0 ? 'block' : 'none';
    }
    </script>
</header>

</body>
</html>
